<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0f0f2a"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0b830"/>
      <stop offset="100%" stop-color="#e94560"/>
    </linearGradient>
  </defs>
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="250" fill="url(#bg)" stroke="#f0b830" stroke-width="8"/>
  <!-- 放大镜 -->
  <circle cx="220" cy="210" r="100" fill="none" stroke="url(#lens)" stroke-width="20"/>
  <line x1="290" y1="280" x2="350" y2="340" stroke="#f0b830" stroke-width="20" stroke-linecap="round"/>
  <!-- 定位标记 -->
  <circle cx="220" cy="210" r="20" fill="#f0b830"/>
  <!-- 文字 -->
  <text x="256" y="430" text-anchor="middle" fill="#f0b830" font-size="42" font-family="sans-serif" font-weight="bold">OSINT</text>
</svg>
